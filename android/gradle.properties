# JVM 参数：给 Gradle 守护进程足够内存。
#
# 注意：**不要**在这里设置 -Dfile.encoding=UTF-8。
# 工作区路径含中文（D:\desk\自律app），而 Java 在 Windows 上构造子进程命令行时
# 使用平台字符集；把守护进程的 file.encoding 改成 UTF-8 会让传给子进程
# （尤其是 Gradle 测试 worker）的 classpath 编码错位，导致
#   ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain
# 并且 jdk.lang.Process.allowAmbiguousCommands=false 会强制走安全引号路径。
org.gradle.jvmargs=-Xmx2048m -Djdk.lang.Process.allowAmbiguousCommands=false

# 并行与缓存，加快增量构建
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 只生成 armeabi-v7a / arm64-v8a，个人自用无需 x86
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# 工作区路径含中文（D:\desk\自律app）。
# AGP 默认会因此抛 StopExecutionException 直接拒绝构建。
#
# 这里关闭该检查，但**不把它当作问题已解决**：
# 每次构建后用 tools/verify-apk.ps1 调用独立的 aapt2 校验产物，
# 以此证明中文路径下产出的 APK 确实有效。
# 若出现任何路径相关的诡异错误，回退方案是把项目移到 ASCII 路径
# （见 docs/开发计划.md T1.1a）。
# ---------------------------------------------------------------------------
android.overridePathCheck=true
