<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>czj 的个人学习网站</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 60px 80px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(46, 125, 50, 0.2);
    border-top: 6px solid #2e7d32;
  }

  .icon {
    font-size: 56px;
    margin-bottom: 20px;
  }

  h1 {
    color: #1b5e20;
    font-size: 36px;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  p {
    color: #43a047;
    font-size: 18px;
    margin-bottom: 30px;
  }

  .divider {
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #66bb6a, #2e7d32);
    border-radius: 2px;
    margin: 0 auto 30px;
  }

  .btn {
    display: inline-block;
    padding: 12px 36px;
    background: #2e7d32;
    color: #ffffff;
    text-decoration: none;
    border-radius: 50px;
    font-size: 16px;
    transition: background 0.3s, transform 0.2s;
  }

  .btn:hover {
    background: #1b5e20;
    transform: translateY(-2px);
  }

  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: #2e7d32;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>

  <main class="card">
    <div class="icon">🌱</div>
    <h1>欢迎访问 czj 的个人学习网站</h1>
    <div class="divider"></div>
    <p>好好学习，天天向上</p>
    <a class="btn" href="#">开始探索</a>
  </main>

  <footer>© 2026 czj · Powered by 学习的热情</footer>

</body>
</html>
